- name: Configure Redis Server on Multi-OS Private Instances
  hosts: all
  gather_facts: yes
  become: yes

  tasks:
    # --- Dynamic Variable Assignment ---
    - name: Set OS specific variables for RedHat (Amazon Linux 2023)
      ansible.builtin.set_fact:
        redis_package: "redis"
        redis_conf_path: "/etc/redis/redis.conf"
        redis_service_name: "redis"
      when: ansible_os_family == "RedHat"

    - name: Set OS specific variables for Debian (Ubuntu)
      ansible.builtin.set_fact:
        redis_package: "redis-server"
        redis_conf_path: "/etc/redis/redis.conf"
        redis_service_name: "redis-server"
      when: ansible_os_family == "Debian"

    # --- Package Installation ---
    - name: Install Redis on Amazon Linux
      ansible.builtin.dnf:
        name: "{{ redis_package }}"
        state: present
      when: ansible_os_family == "RedHat"

    - name: Install Redis on Ubuntu
      ansible.builtin.apt:
        name: "{{ redis_package }}"
        state: present
        update_cache: yes
      when: ansible_os_family == "Debian"

    # --- Configure Binding ---
    - name: Allow Redis connections from local network
      ansible.builtin.lineinfile:
        path: "{{ redis_conf_path }}"
        regexp: '^bind '
        line: 'bind 0.0.0.0'
      notify: Restart Redis Service

    # --- Service Start & Enable ---
    - name: Ensure Redis Service is Started & Enabled
      ansible.builtin.service:
        name: "{{ redis_service_name }}"
        state: started
        enabled: yes

  handlers:
    - name: Restart Redis Service
      ansible.builtin.service:
        name: "{{ redis_service_name }}"
        state: restarted